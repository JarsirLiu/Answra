<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <title>Answra 整体架构 · 一图速览</title>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1440" height="1020" fill="#ffffff"/>
  <text x="40" y="48" font-size="30" font-weight="700" fill="#111827">Answra 整体架构</text>
  <text x="40" y="76" font-size="13" fill="#64748b">按仓库 AGENTS.md 与 .agents/skills/answra-arch/ 现状绘制 · 2026-11-24</text>
  <text x="40" y="102" font-size="15" fill="#334155">上层调用下层（↓ 命令 / 调度 / 使用），条目与帧向上回传（↑ 折叠后给人）；按 ①—⑦ 走一遍，就是一条消息的完整旅程。</text>

  <!-- ============ 使用者：层外角色 ============ -->
  <rect x="24" y="118" width="1392" height="56" rx="8" fill="#f1f5f9"/>
  <rect x="24" y="118" width="5" height="56" fill="#64748b"/>
  <text x="44" y="147" font-size="16" font-weight="700" fill="#475569">使用者</text>
  <text x="44" y="165" font-size="11" fill="#94a3b8">层外角色</text>
  <rect x="150" y="126" width="250" height="40" rx="8" fill="#475569"/>
  <text x="275" y="152" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">人：提目标、验收结果</text>
  <text x="425" y="152" font-size="12" fill="#475569">① 提交目标进入系统　·　⑦ 折叠后的结果回到人（经宿主）</text>

  <!-- ============ 01 产品层 ============ -->
  <rect x="24" y="186" width="1392" height="150" rx="8" fill="#eff6ff"/>
  <rect x="24" y="186" width="5" height="150" fill="#2563eb"/>
  <text x="44" y="232" font-size="18" font-weight="700" fill="#1d4ed8">01 产品层</text>
  <text x="44" y="254" font-size="11" fill="#3b82f6">用户可见宿主</text>
  <text x="44" y="272" font-size="11" fill="#3b82f6">会话入口</text>

  <rect x="150" y="200" width="255" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="277" y="225" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">桌面端</text>
  <text x="277" y="246" font-size="11" fill="#475569" text-anchor="middle">FloatingBar / ReplyBar / Surface</text>

  <rect x="420" y="200" width="235" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="537" y="225" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">CLI</text>
  <text x="537" y="246" font-size="11" fill="#475569" text-anchor="middle">answra code · TUI</text>

  <rect x="670" y="200" width="235" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="787" y="225" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">移动端</text>
  <text x="787" y="246" font-size="11" fill="#475569" text-anchor="middle">controller · Phase 0 骨架</text>

  <rect x="920" y="200" width="420" height="60" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1130" y="225" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">远程 host / controller</text>
  <text x="1130" y="246" font-size="11" fill="#475569" text-anchor="middle">P2P 命令与帧 · 密钥本地保护 · controller 侧不依赖 remote-node</text>

  <rect x="150" y="274" width="1190" height="48" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="745" y="295" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">会话 Session：一个 conversationId = 一条时间线（user / assistant / tool 条目）</text>
  <text x="745" y="313" font-size="11" fill="#475569" text-anchor="middle">宿主只提交命令、折叠帧；不写条目、不推理状态</text>

  <path d="M277 166 L277 198" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <circle cx="302" cy="182" r="13" fill="#2563eb"/><text x="302" y="187" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <path d="M277 260 L277 272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <path d="M537 260 L537 272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <path d="M787 260 L787 272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <path d="M1130 260 L1130 272" stroke="#2563eb" stroke-width="1.5" marker-end="url(#aBlue)"/>

  <!-- ============ 02 协作控制面 ============ -->
  <rect x="24" y="348" width="1392" height="150" rx="8" fill="#fff7ed"/>
  <rect x="24" y="348" width="5" height="150" fill="#ea580c"/>
  <text x="44" y="394" font-size="17" font-weight="700" fill="#c2410c">02 控制面</text>
  <text x="44" y="416" font-size="10" fill="#ea580c">谁来做</text>
  <text x="44" y="434" font-size="10" fill="#ea580c">事实 / 调度 / 派发</text>

  <rect x="150" y="374" width="220" height="98" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="260" y="409" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Session 账本</text>
  <text x="260" y="432" font-size="11" fill="#9a3412" text-anchor="middle">责任 / 状态 / 版本</text>
  <text x="260" y="451" font-size="11" fill="#9a3412" text-anchor="middle">SessionItemStore · seq</text>

  <rect x="430" y="374" width="180" height="98" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="520" y="409" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">收件箱</text>
  <text x="520" y="432" font-size="11" fill="#9a3412" text-anchor="middle">谁该被唤醒</text>
  <text x="520" y="451" font-size="11" fill="#9a3412" text-anchor="middle">TurnScheduler 队列</text>

  <rect x="672" y="374" width="220" height="98" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="782" y="409" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">派发器</text>
  <text x="782" y="432" font-size="11" fill="#9a3412" text-anchor="middle">选哪个 Bot、防重复执行</text>
  <text x="782" y="451" font-size="11" fill="#9a3412" text-anchor="middle">TurnExecutor / StepExecutor</text>

  <rect x="954" y="374" width="400" height="98" rx="8" fill="#f3e8ff" stroke="#c4b5fd"/>
  <text x="1154" y="409" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">血缘</text>
  <text x="1154" y="432" font-size="11" fill="#6d28d9" text-anchor="middle">谁长出了谁</text>
  <text x="1154" y="451" font-size="11" fill="#6d28d9" text-anchor="middle">Bot 目录 / 交接 handoff（同一 Turn 内）</text>

  <path d="M745 322 C 700 360, 350 345, 262 372" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#aOrange)"/>
  <circle cx="470" cy="344" r="13" fill="#ea580c"/><text x="470" y="349" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <path d="M370 423 L423 423" stroke="#ea580c" stroke-width="2" marker-end="url(#aOrange)"/>
  <circle cx="397" cy="404" r="13" fill="#ea580c"/><text x="397" y="409" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <path d="M610 423 L665 423" stroke="#ea580c" stroke-width="2" marker-end="url(#aOrange)"/>
  <circle cx="638" cy="404" r="13" fill="#ea580c"/><text x="638" y="409" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <path d="M892 423 L947 423" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aPurple)"/>

  <!-- ============ 03 执行面 ============ -->
  <rect x="24" y="510" width="1392" height="160" rx="8" fill="#ecfdf5"/>
  <rect x="24" y="510" width="5" height="160" fill="#059669"/>
  <text x="44" y="556" font-size="18" font-weight="700" fill="#047857">03 执行面</text>
  <text x="44" y="578" font-size="11" fill="#059669">怎么做</text>
  <text x="44" y="596" font-size="11" fill="#059669">领域 / 循环 / 执行</text>

  <rect x="150" y="536" width="160" height="98" rx="8" fill="#047857"/>
  <text x="230" y="573" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">对话会话</text>
  <text x="230" y="597" font-size="11" fill="#d1fae5" text-anchor="middle">同话题续接</text>
  <text x="230" y="617" font-size="10" fill="#a7f3d0" text-anchor="middle">conversation</text>

  <rect x="324" y="536" width="160" height="98" rx="8" fill="#047857"/>
  <text x="404" y="573" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">任务会话</text>
  <text x="404" y="597" font-size="11" fill="#d1fae5" text-anchor="middle">每轮一个</text>
  <text x="404" y="617" font-size="10" fill="#a7f3d0" text-anchor="middle">coding</text>

  <rect x="498" y="536" width="160" height="98" rx="8" fill="#047857"/>
  <text x="578" y="573" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">验收会话</text>
  <text x="578" y="597" font-size="11" fill="#d1fae5" text-anchor="middle">每次新建</text>
  <text x="578" y="617" font-size="10" fill="#a7f3d0" text-anchor="middle">answer · 只内存</text>

  <rect x="672" y="536" width="160" height="98" rx="8" fill="#047857"/>
  <text x="752" y="573" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">面试演练</text>
  <text x="752" y="597" font-size="11" fill="#d1fae5" text-anchor="middle">转录 + 自动回复</text>
  <text x="752" y="617" font-size="10" fill="#a7f3d0" text-anchor="middle">interview</text>

  <rect x="890" y="528" width="220" height="114" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="1000" y="568" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Agent 引擎</text>
  <text x="1000" y="591" font-size="11" fill="#047857" text-anchor="middle">循环 / 恢复 / 取消</text>
  <text x="1000" y="610" font-size="10" fill="#047857" text-anchor="middle">AI SDK · ProviderStepRunner</text>
  <text x="1000" y="628" font-size="10" fill="#047857" text-anchor="middle">一次响应 = 一个 Step</text>

  <rect x="1140" y="528" width="220" height="114" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1250" y="568" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">本地执行端</text>
  <text x="1250" y="591" font-size="11" fill="#9a3412" text-anchor="middle">在用户电脑上</text>
  <text x="1250" y="610" font-size="10" fill="#9a3412" text-anchor="middle">ToolRegistry · ToolId[]</text>
  <text x="1250" y="628" font-size="10" fill="#9a3412" text-anchor="middle">desktop 只给上下文</text>

  <path d="M760 472 C 800 494, 890 490, 950 528" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M790 472 C 950 477, 1100 474, 1200 528" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#aOrange)"/>
  <circle cx="900" cy="486" r="13" fill="#059669"/><text x="900" y="491" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>

  <path d="M330 536 C 330 514, 300 491, 270 474" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <circle cx="350" cy="508" r="13" fill="#94a3b8"/><text x="350" y="513" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>

  <path d="M150 560 C 120 500, 120 230, 150 148" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <circle cx="130" cy="504" r="13" fill="#94a3b8"/><text x="130" y="509" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>

  <!-- ============ 04 基础能力 ============ -->
  <rect x="24" y="682" width="1392" height="115" rx="8" fill="#f8fafc"/>
  <rect x="24" y="682" width="5" height="115" fill="#64748b"/>
  <text x="44" y="728" font-size="18" font-weight="700" fill="#475569">04 基础能力</text>
  <text x="44" y="750" font-size="11" fill="#94a3b8">可复用底座</text>
  <text x="44" y="768" font-size="11" fill="#94a3b8">不含沙箱</text>

  <rect x="150" y="702" width="220" height="76" rx="6" fill="#e2e8f0"/>
  <text x="260" y="731" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">上下文与记忆</text>
  <text x="260" y="753" font-size="11" fill="#64748b" text-anchor="middle">AGENTS.md · skill · 压缩</text>

  <rect x="385" y="702" width="210" height="76" rx="6" fill="#e2e8f0"/>
  <text x="490" y="731" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">文件与产物</text>
  <text x="490" y="753" font-size="11" fill="#64748b" text-anchor="middle">sessions.sqlite · workspace</text>

  <rect x="610" y="702" width="210" height="76" rx="6" fill="#e2e8f0"/>
  <text x="715" y="729" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">工具执行</text>
  <text x="715" y="748" font-size="11" fill="#64748b" text-anchor="middle">ToolRegistry · ToolId[]</text>
  <text x="715" y="766" font-size="10" fill="#b45309" text-anchor="middle">无沙箱 / 无审批；Agent 进程权限</text>

  <rect x="835" y="702" width="210" height="76" rx="6" fill="#e2e8f0"/>
  <text x="940" y="731" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">模型</text>
  <text x="940" y="753" font-size="11" fill="#64748b" text-anchor="middle">AI SDK · provider · 重试</text>

  <rect x="1060" y="702" width="290" height="76" rx="6" fill="#e2e8f0"/>
  <text x="1205" y="731" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">连接与凭据</text>
  <text x="1205" y="753" font-size="11" fill="#64748b" text-anchor="middle">remote · config · keychain / safeStorage</text>

  <!-- ============ 编号图例 ============ -->
  <text x="40" y="828" font-size="16" font-weight="700" fill="#111827">一条消息的旅程</text>
  <text x="195" y="828" font-size="12" fill="#64748b">（编号对应上方箭头；⑦ 从执行面跨层回到使用者）</text>

  <circle cx="52" cy="864" r="13" fill="#2563eb"/><text x="52" y="869" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="76" y="869" font-size="13" fill="#334155">人在宿主提交目标（会话 / 领域选择）</text>
  <circle cx="52" cy="900" r="13" fill="#ea580c"/><text x="52" y="905" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="76" y="905" font-size="13" fill="#334155">Application 校验 Bot 归属，user 消息先入账</text>
  <circle cx="52" cy="936" r="13" fill="#ea580c"/><text x="52" y="941" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="76" y="941" font-size="13" fill="#334155">状态变化产生唤醒：TurnScheduler 认领排队 Turn</text>
  <circle cx="52" cy="972" r="13" fill="#ea580c"/><text x="52" y="977" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="76" y="977" font-size="13" fill="#334155">派发器认领：beginTurn、占位 assistant、决定怎么跑</text>

  <circle cx="740" cy="864" r="13" fill="#059669"/><text x="740" y="869" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="764" y="869" font-size="13" fill="#334155">StepExecutor 单次模型请求 → 工具授权执行 → 可继续下一步</text>
  <circle cx="740" cy="900" r="13" fill="#94a3b8"/><text x="740" y="905" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="764" y="905" font-size="13" fill="#334155">finishTurn 收口：内存视图 → 条目 → 帧，写回 Session 账本</text>
  <circle cx="740" cy="936" r="13" fill="#94a3b8"/><text x="740" y="941" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <text x="764" y="941" font-size="13" fill="#334155">durable（seq）/ live（增量）双通道 → 宿主折叠 → 人验收</text>
  <text x="764" y="977" font-size="12" fill="#64748b">硬约束：条目是唯一 durable 形态 · seq 只由 SessionItemStore 分配 · 恢复顺序不可颠倒</text>
</svg>
