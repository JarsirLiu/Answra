<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>框选截图区域</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
      }
      /* 普通截图框选用十字光标提示拖拽；隐身模式必须覆盖此提示，
         让截图、选择与其他操作都不改变光标形状。 */
      html.stealth,
      html.stealth * {
        cursor: default;
      }
      /* 选区只有一圈虚线框：无蒙层、无填充、无外圈描边，变色龙理念下
         对屏幕零干扰。颜色由渲染器按当前主题派生（--selection-line，
         发起截图时经 IPC 注入），未注入时回落中性中灰。 */
      #rect {
        position: fixed;
        display: none;
        border: 1px dashed var(--selection-line, rgba(148, 163, 184, 0.9));
      }
    </style>
  </head>
  <body>
    <div id="rect"></div>
    <script>
      // 本窗口覆盖联合显示器边界；选区仍限制在按下鼠标的那台显示器内。
      const params = new URLSearchParams(location.search);
      const originX = Number(params.get("originX") ?? 0);
      const originY = Number(params.get("originY") ?? 0);
      const displays = JSON.parse(params.get("displays") ?? "[]");
      // 框选线色随发起方主题（变色龙/深浅模式）联动；主进程已校验为字面 CSS 颜色
      const line = params.get("line");
      if (line) document.documentElement.style.setProperty("--selection-line", line);
      // 与主窗口共用主进程维护的隐身状态，避免框选 overlay 绕过隐身光标约束。
      if (params.get("stealth") === "true") document.documentElement.classList.add("stealth");
      const rectEl = document.getElementById("rect");
      const MIN_SIZE = 8; // 小于该尺寸视为点击误触，保持 overlay 打开而非取消
      let startPoint = null;
      let startDisplay = null;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function localPoint(event) {
        return {
          x: clamp(event.clientX, 0, window.innerWidth - 1),
          y: clamp(event.clientY, 0, window.innerHeight - 1),
        };
      }

      function pointOnStartDisplay(event) {
        const point = localPoint(event);
        if (!startDisplay) return point;
        return {
          x: clamp(point.x, startDisplay.x - originX, startDisplay.x - originX + startDisplay.width - 1),
          y: clamp(point.y, startDisplay.y - originY, startDisplay.y - originY + startDisplay.height - 1),
        };
      }

      function normalize(end) {
        const anchor = startPoint ?? end;
        return {
          x: Math.min(anchor.x, end.x),
          y: Math.min(anchor.y, end.y),
          width: Math.abs(end.x - anchor.x),
          height: Math.abs(end.y - anchor.y),
        };
      }

      function draw(event) {
        const rect = normalize(event);
        rectEl.style.display = "block";
        rectEl.style.left = `${rect.x}px`;
        rectEl.style.top = `${rect.y}px`;
        rectEl.style.width = `${rect.width}px`;
        rectEl.style.height = `${rect.height}px`;
      }

      window.addEventListener("mousedown", (event) => {
        const point = localPoint(event);
        const absolutePoint = { x: point.x + originX, y: point.y + originY };
        startDisplay = displays.find((display) =>
          absolutePoint.x >= display.x && absolutePoint.x < display.x + display.width &&
          absolutePoint.y >= display.y && absolutePoint.y < display.y + display.height
        );
        if (!startDisplay) return;
        startPoint = pointOnStartDisplay(event);
        draw(startPoint);
      });
      window.addEventListener("mousemove", (event) => {
        if (startPoint) draw(pointOnStartDisplay(event));
      });
      window.addEventListener("mouseup", (event) => {
        if (!startPoint) return;
        const endPoint = pointOnStartDisplay(event);
        const rect = normalize(endPoint);
        const selectedDisplay = startDisplay;
        startPoint = null;
        startDisplay = null;
        // 误触（未拖出有效区域）：保持 overlay 打开，等待有效拖拽或 Esc，不再静默取消
        if (rect.width < MIN_SIZE || rect.height < MIN_SIZE) {
          rectEl.style.display = "none";
          return;
        }
        window.answraSelection.confirm({
          displayId: selectedDisplay.id,
          rect: {
            x: rect.x + originX - selectedDisplay.x,
            y: rect.y + originY - selectedDisplay.y,
            width: rect.width,
            height: rect.height,
          },
          point: {
            x: endPoint.x + originX - selectedDisplay.x,
            y: endPoint.y + originY - selectedDisplay.y,
          },
        });
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.answraSelection.cancel();
      });
    </script>
  </body>
</html>
