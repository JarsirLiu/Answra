name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Engineering Note check
        env:
          NOTE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm notes:check --base "$env:NOTE_BASE"

      - name: Architecture check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Prepare TEN VAD resources
        run: pnpm --filter @answra/desktop vad:prepare

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
