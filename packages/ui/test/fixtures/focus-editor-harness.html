<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>输入焦点测试</title>
    <style>
      :root {
        color: #202522;
        background: #f3f5f2;
        font: 15px/1.55 "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page { width: min(760px, 100%); margin: 0 auto; padding: 32px 24px 48px; }
      header { padding-bottom: 20px; border-bottom: 1px solid #cbd2cb; }
      .eyebrow { margin: 0; color: #53685a; font-size: 12px; }
      h1 { margin: 4px 0 8px; font-size: 26px; }
      .intro { max-width: 650px; margin: 0; color: #4d5750; }
      section { padding: 18px 0; border-bottom: 1px solid #cbd2cb; }
      h2 { margin: 0 0 10px; font-size: 17px; }
      h3 { margin: 0 0 8px; font-size: 15px; }
      textarea, .cm-editor { border: 1px solid #929d94; border-radius: 4px; background: white; }
      textarea { padding: 10px; }
      .cm-editor { min-height: 72px; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; }
      button { min-height: 38px; padding: 7px 12px; border: 1px solid #69766c; border-radius: 4px; background: white; color: #202522; font: inherit; cursor: pointer; }
      button:hover { background: #e5ece6; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #3a7951; outline-offset: 2px; }
      .results { padding: 18px 14px; background: #e8eee8; }
      #results, #window-events { margin: 0; padding-left: 22px; }
      #window-state { margin: 0 0 8px; font-weight: 600; }
      @media (max-width: 520px) {
        .page { padding: 22px 16px 32px; }
        nav { display: grid; }
        button { text-align: left; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/test/fixtures/focus-editor-harness.tsx"></script>
  </body>
</html>
