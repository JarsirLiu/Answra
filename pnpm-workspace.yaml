packages:
  - packages/*
  - apps/*
  - examples/*
allowBuilds:
  '@parcel/watcher': set this to true or false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node: true
  node-bin-setup: true
overrides:
  '@electron/get@^3.0.0': 3.1.0
minimumReleaseAgeExclude:
  - '@types/node@26.6.5'
