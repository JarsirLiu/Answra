name: Build Answer installers

# Build platform installers independently, then publish one discoverable Answer release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: answer-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Answer ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: dist:win
          - platform: macos
            os: macos-15
            script: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build Answer installer
        run: pnpm ${{ matrix.script }}

      - name: Validate Windows installer
        if: matrix.platform == 'windows'
        shell: bash
        run: test -s apps/desktop/release/Answra-Setup-x64.exe

      - name: Validate macOS installers
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          test -s apps/desktop/release/Answra-arm64.dmg
          test -s apps/desktop/release/Answra-x64.dmg

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: answra-answer-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Answer installers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: answra-answer-*
          merge-multiple: true
          path: release-assets

      - name: Verify installers and publish download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/Answra-Setup-x64.exe
          test -s release-assets/Answra-arm64.dmg
          test -s release-assets/Answra-x64.dmg

          version="$(node -e 'const { readFileSync } = require("node:fs"); console.log(JSON.parse(readFileSync("apps/desktop/package.json", "utf8")).version)')"
          release_tag="v${version}"
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          cat > release-notes.md <<EOF
          ## 直接下载 Answer 安装包

          - [Windows x64 安装包（.exe）](${base}/Answra-Setup-x64.exe)
          - [macOS Apple Silicon 安装包（arm64 .dmg）](${base}/Answra-arm64.dmg)
          - [macOS Intel 安装包（x64 .dmg）](${base}/Answra-x64.dmg)

          EOF

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber
            gh release edit "$release_tag" \
              --title "Answra ${version}" \
              --notes-file release-notes.md
            release_id="$(gh release view "$release_tag" --json databaseId --jq .databaseId)"
          else
            gh release create "$release_tag" release-assets/* \
              --title "Answra ${version}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
            release_id="$(gh release view "$release_tag" --json databaseId --jq .databaseId)"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --method PATCH \
            -F name="Answra ${version}" \
            -F body="$(cat release-notes.md)" \
            -F prerelease=false \
            -f make_latest=true

          # Keep the release list versioned; remove the former floating tag after
          # the versioned release has been published successfully.
          if gh release view answer-latest >/dev/null 2>&1; then
            gh release delete answer-latest --yes --cleanup-tag
          fi
