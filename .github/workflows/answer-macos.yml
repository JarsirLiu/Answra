name: Build Answer macOS

# Answer 版 macOS 验证包：代码推送后自动构建并更新 GitHub Release。
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: answer-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Answer macOS installer
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build Answer installer
        run: pnpm dist:mac

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: answra-answer-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Answer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view answer-latest >/dev/null 2>&1; then
            gh release edit answer-latest \
              --title "Answra Answer macOS (latest)" \
              --notes "由 main 分支自动构建的 Answer 版 macOS 安装包。" \
              --prerelease
          else
            gh release create answer-latest \
              --title "Answra Answer macOS (latest)" \
              --notes "由 main 分支自动构建的 Answer 版 macOS 安装包。" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload answer-latest \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/*.blockmap \
            apps/desktop/release/latest*.yml \
            --clobber
