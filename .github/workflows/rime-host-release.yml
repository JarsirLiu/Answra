name: Rime helper release

on:
  push:
    tags:
      - answra-rime-host-v*

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64 helper
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "rime-host-build"
          $output = Join-Path $env:RUNNER_TEMP "rime-host-output"
          cmake -S apps/desktop/native/rime-host -B $build -A x64 "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$output"
          cmake --build $build --config Release
          Copy-Item (Join-Path $output "answra-rime-host.exe") (Join-Path $env:RUNNER_TEMP "answra-rime-host-win32.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: rime-host-win32
          path: ${{ runner.temp }}/answra-rime-host-win32.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS helper
        shell: bash
        run: |
          cmake -S apps/desktop/native/rime-host -B "$RUNNER_TEMP/rime-host-build" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$RUNNER_TEMP/rime-host-output"
          cmake --build "$RUNNER_TEMP/rime-host-build" --config Release
          cp "$RUNNER_TEMP/rime-host-output/answra-rime-host" "$RUNNER_TEMP/answra-rime-host-darwin"
      - uses: actions/upload-artifact@v4
        with:
          name: rime-host-darwin
          path: ${{ runner.temp }}/answra-rime-host-darwin
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rime-host-*
          path: release-files
          merge-multiple: true
      - name: Publish versioned helper assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-files && sha256sum answra-rime-host-win32.exe answra-rime-host-darwin > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt Windows x64 and macOS universal librime helper binaries."
